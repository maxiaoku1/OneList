<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1,viewport-fit=cover">
    <title>CTList - /</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/artplayer@5.1.1/dist/artplayer.min.css">
    <style>
        :root {
            --bg: linear-gradient(145deg, #f8f8f8 0%, #ececec 100%);
            --card: rgba(255, 255, 255, 0.75);
            --text: #0f0f10;
            --muted: #555;
            --accent: #0f0f10;
            --border: rgba(255, 255, 255, 0.35);
            --shadow: 0 25px 60px rgba(15, 15, 16, 0.12);
            --blur: 18px;
        }

        [data-theme="dark"] {
            --bg: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.06) 0, transparent 35%),
            radial-gradient(circle at 80% 0%, rgba(255, 255, 255, 0.06) 0, transparent 30%),
            #060607;
            --card: rgba(14, 14, 16, 0.68);
            --text: #f5f5f5;
            --muted: #a6a6ac;
            --accent: #f5f5f5;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
            --blur: 20px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', 'PingFang SC', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
            transition: background 0.35s ease, color 0.35s ease;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.14), transparent 30%),
            radial-gradient(circle at 90% 10%, rgba(0, 0, 0, 0.08), transparent 25%),
            radial-gradient(circle at 50% 80%, rgba(0, 0, 0, 0.06), transparent 30%);
            z-index: 0;
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .glass-card {
            background: var(--card);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }

        header.glass-card {
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            letter-spacing: 0.2px;
            font-size: 20px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.25);
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
            transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.25s ease, color 0.25s ease;
        }

        [data-theme="dark"] .pill {
            background: rgba(255, 255, 255, 0.05);
        }

        .pill:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        .path {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            font-size: 14px;
            color: var(--muted);
        }

        .breadcrumb {
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }

        .crumb {
            color: inherit;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px dashed var(--border);
            background: rgba(255, 255, 255, 0.18);
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        [data-theme="dark"] .crumb {
            background: rgba(255, 255, 255, 0.06);
        }

        .crumb:hover {
            border-color: rgba(0, 0, 0, 0.2);
        }

        .search-box {
            flex: 1;
            min-width: 240px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--border);
        }

        [data-theme="dark"] .search-box {
            background: rgba(255, 255, 255, 0.07);
        }

        .search-box input {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.05);
            color: var(--muted);
            font-weight: 600;
        }

        [data-theme="dark"] .badge {
            background: rgba(255, 255, 255, 0.08);
        }

        .list-card {
            padding: 10px 14px 6px;
        }

        .list-head, .file-row {
            display: grid;
            grid-template-columns: 1fr 120px 90px auto;
            align-items: center;
            gap: 10px;
            padding: 12px 10px;
        }

        .list-head {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--muted);
        }

        .list-head button {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        .file-row {
            border-radius: 14px;
            padding-inline: 12px;
            transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .file-row:hover {
            background: rgba(255, 255, 255, 0.32);
            transform: translateY(-1px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
        }

        [data-theme="dark"] .file-row:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .file-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .file-meta .material-icons-round {
            font-size: 22px;
        }

        .file-meta .name {
            font-weight: 600;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .file-meta a {
            color: var(--text);
            text-decoration: none;
        }

        .time, .size {
            color: var(--muted);
            font-size: 13px;
            text-align: right;
            white-space: nowrap;
        }

        .preview-toggle {
            justify-self: flex-end;
            display: none;
            align-items: center;
        }

        .file-row:hover .preview-toggle {
            display: inline-flex;
        }

        .preview-pill {
            padding: 6px 10px;
        }

        .preview-placeholder {
            justify-self: flex-end;
        }

        .preview-layer {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .preview-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        .preview-card {
            width: min(1200px, 92vw);
            height: min(720px, 84vh);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .preview-title {
            font-weight: 700;
            font-size: 16px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .preview-body {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        [data-theme="dark"] .preview-body {
            background: rgba(255, 255, 255, 0.05);
        }

        .preview-body img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .preview-body .text-preview {
            width: 100%;
            height: 100%;
            overflow: auto;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 12px;
            padding: 12px;
            font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
            color: var(--text);
            white-space: pre-wrap;
            line-height: 1.55;
        }

        [data-theme="dark"] .preview-body .text-preview {
            background: rgba(255, 255, 255, 0.04);
        }

        .preview-body audio {
            width: 100%;
            margin-top: 12px;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 780px) {
            body { padding: 16px; }
            .list-head, .file-row { grid-template-columns: 1fr; align-items: flex-start; }
            .time, .size { text-align: left; }
            .preview-toggle { display: inline-flex; justify-self: flex-start; }
            .preview-card { height: 90vh; }
            .toolbar { gap: 8px; }
        }
    </style>
</head>
<body>
<div class="page">
    <header class="glass-card">
        <div class="header-top">
            <div class="title">
                <span class="material-icons-round">all_inclusive</span>
                <span>HaorWu / New</span>
            </div>
            <div class="badge" id="item-count">0 项内容</div>
            <button class="pill" id="theme-toggle">
                <span class="material-icons-round">brightness_4</span>
                <span>日/夜</span>
            </button>
            <button class="pill" id="back-button">
                <span class="material-icons-round">arrow_back</span>
                返回
            </button>
        </div>
        <div class="toolbar">
            <div class="path">
                <span class="material-icons-round" style="font-size:18px;">route</span>
                <div class="breadcrumb" id="breadcrumb"></div>
            </div>
            <div class="search-box">
                <span class="material-icons-round">search</span>
                <input id="search" type="text" placeholder="搜索文件 / 预览" aria-label="搜索">
            </div>
        </div>
    </header>

    <section class="glass-card list-card">
        <div class="list-head">
            <button data-sort="name" type="button">文件 <span class="material-icons-round" aria-hidden="true">swap_vert</span></button>
            <button data-sort="date" type="button">时间 <span class="material-icons-round" aria-hidden="true">swap_vert</span></button>
            <button data-sort="size" type="button">大小 <span class="material-icons-round" aria-hidden="true">swap_vert</span></button>
        </div>
        <div id="file-list"></div>
    </section>
</div>

<div class="preview-layer" id="preview-layer" role="dialog" aria-modal="true">
    <div class="glass-card preview-card">
        <div class="preview-header">
            <div class="preview-title" id="preview-title"></div>
            <div class="preview-actions">
                <a class="pill preview-pill" id="open-original" href="#" target="_blank" rel="noreferrer">
                    <span class="material-icons-round">open_in_new</span>
                    原始链接
                </a>
                <button class="pill preview-pill" id="close-preview" type="button">
                    <span class="material-icons-round">close</span>
                    关闭
                </button>
            </div>
        </div>
        <div class="preview-body" id="preview-body"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/artplayer@5.1.1/dist/artplayer.min.js"></script>
<script>
    const rootPath = "{{.RootPath}}";
    let currentPath = "{{.CurrentPath}}";
    const rawData = "{{.RawData}}";
    const pageData = JSON.parse(window.atob(rawData));
    const protocol = window.location.protocol;
    const domain = window.location.host;

    if (currentPath === "/") currentPath = "";

    const files = [];
    const folders = [];
    const previewLayer = document.getElementById('preview-layer');
    const previewTitle = document.getElementById('preview-title');
    const previewBody = document.getElementById('preview-body');
    const openOriginal = document.getElementById('open-original');
    const itemCount = document.getElementById('item-count');
    let art = null;
    const state = { sortKey: 'name', direction: 'asc', search: '' };

    function decodeName(name) {
        try { return decodeURIComponent(name); } catch (e) { return name; }
    }

    for (let key in pageData) {
        if (key.indexOf('@') === 0) continue;
        const entry = { ...pageData[key], name: decodeName(pageData[key]['name'] || '') };
        if (entry['@type'] === 'folder') {
            folders.push(entry);
        } else if (entry['@type'] === 'file') {
            files.push(entry);
        }
    }

    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('haorwu-new-theme', theme);
    }

    function initTheme() {
        const saved = localStorage.getItem('haorwu-new-theme');
        const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        setTheme(theme);
    }

    function pathJoin(base, child = '') {
        const cleanBase = base.replace(/\/+$/, '');
        const cleanChild = child.replace(/^\/+/, '');
        return `${cleanBase}/${cleanChild}`.replace(/\/{2,}/g, '/');
    }

    function buildUrl(name) {
        const base = currentPath || '/';
        const href = `${base}${base.endsWith('/') ? '' : '/'}${encodeURIComponent(name)}`;
        return new URL(href, `${protocol}//${domain}`).href;
    }

    function sizeToNumber(size) {
        if (!size) return 0;
        const [value, unit] = size.split(' ');
        const n = parseFloat(value) || 0;
        const map = { B: 0, KB: 10, MB: 20, GB: 30, TB: 40 };
        return n * Math.pow(2, map[unit] || 0);
    }

    function getFileType(name) {
        const ext = (name.split('.').pop() || '').toLowerCase();
        if (['png','jpg','jpeg','webp','gif','bmp','svg','avif'].includes(ext)) return 'image';
        if (['mp4','mkv','mov','avi','wmv','flv','m3u8','webm'].includes(ext)) return 'video';
        if (['mp3','ogg','wav','flac','aac','m4a','ape'].includes(ext)) return 'audio';
        if (['txt','md','log','json','js','ts','css','html','xml','py','java','go','rs'].includes(ext)) return 'text';
        if (ext === 'pdf') return 'pdf';
        return 'other';
    }

    function iconFor(type, isFolder = false) {
        if (isFolder) return 'folder_open';
        const map = { image: 'image', video: 'movie', audio: 'library_music', text: 'description', pdf: 'picture_as_pdf', other: 'insert_drive_file' };
        return map[type] || 'insert_drive_file';
    }

    function breadcrumb() {
        const container = document.getElementById('breadcrumb');
        container.innerHTML = '';
        const segments = (currentPath || '').replace(rootPath, '').split('/').filter(Boolean);
        const base = rootPath === '/' ? '' : rootPath;
        const home = document.createElement('a');
        home.className = 'crumb';
        home.href = pathJoin(base || '/');
        home.textContent = '根目录';
        container.appendChild(home);
        let accumulated = base;
        segments.forEach((seg) => {
            accumulated = pathJoin(accumulated || '/', seg);
            const link = document.createElement('a');
            link.className = 'crumb';
            link.href = accumulated;
            link.textContent = seg;
            container.appendChild(link);
        });
    }

    function renderList() {
        const list = document.getElementById('file-list');
        list.innerHTML = '';
        const dataset = [...folders, ...files];
        const term = state.search.trim().toLowerCase();
        let filtered = term ? dataset.filter(item => (item.name || '').toLowerCase().includes(term)) : dataset;

        filtered.sort((a, b) => {
            const dir = state.direction === 'asc' ? 1 : -1;
            if (state.sortKey === 'size') {
                return (sizeToNumber(a.size) - sizeToNumber(b.size)) * dir;
            }
            if (state.sortKey === 'date') {
                return (new Date(a.date || 0) - new Date(b.date || 0)) * dir;
            }
            return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase()) * dir;
        });

        itemCount.textContent = `${filtered.length} 项内容`;

        if (!filtered.length) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = '这里空空如也，试试切换目录或清空搜索条件。';
            list.appendChild(empty);
            return;
        }

        filtered.forEach(item => {
            const isFolder = item['@type'] === 'folder';
            const type = isFolder ? 'folder' : getFileType(item.name);
            const previewable = isPreviewable(type);
            const row = document.createElement('div');
            row.className = 'file-row';

            const meta = document.createElement('div');
            meta.className = 'file-meta';
            const icon = document.createElement('span');
            icon.className = 'material-icons-round';
            icon.textContent = iconFor(type, isFolder);

            const link = document.createElement('a');
            link.href = buildUrl(item.name);
            link.className = 'name';
            link.textContent = item.name;

            meta.appendChild(icon);
            meta.appendChild(link);

            const time = document.createElement('div');
            time.className = 'time';
            time.textContent = item.date || '';

            const size = document.createElement('div');
            size.className = 'size';
            size.textContent = isFolder ? '--' : (item.size || '0 B');

            row.appendChild(meta);
            row.appendChild(time);
            row.appendChild(size);
            if (previewable) {
                const previewBtn = document.createElement('button');
                previewBtn.className = 'pill preview-pill preview-toggle';
                previewBtn.type = 'button';
                previewBtn.innerHTML = '<span class="material-icons-round">visibility</span>预览';
                row.appendChild(previewBtn);
                row.addEventListener('click', (e) => handleOpen(e, item, type));
                previewBtn.addEventListener('click', (e) => handlePreview(e, item, type));
            } else {
                const placeholder = document.createElement('div');
                placeholder.className = 'preview-placeholder';
                row.appendChild(placeholder);
            }

            list.appendChild(row);
        });
    }

    function handleOpen(event, item, type) {
        if (item['@type'] === 'folder') return;
        if (isPreviewable(type)) {
            event.preventDefault();
            event.stopPropagation();
            handlePreview(event, item, type);
        }
    }

    function isPreviewable(type) {
        return ['image', 'video', 'audio', 'text', 'pdf'].includes(type);
    }

    function handlePreview(event, item, type) {
        event.preventDefault();
        event.stopPropagation();
        const url = buildUrl(item.name);
        openOriginal.href = url;
        previewTitle.textContent = item.name;
        previewBody.innerHTML = '';
        destroyArt();

        switch (type) {
            case 'image':
                const img = document.createElement('img');
                img.src = url;
                img.alt = item.name;
                previewBody.appendChild(img);
                break;
            case 'audio':
                const audioWrap = document.createElement('div');
                audioWrap.className = 'text-preview';
                audioWrap.textContent = '音频文件，支持在线播放。';
                const audio = document.createElement('audio');
                audio.controls = true;
                audio.src = url;
                previewBody.appendChild(audioWrap);
                previewBody.appendChild(audio);
                break;
            case 'video':
                const playerBox = document.createElement('div');
                playerBox.id = 'artplayer-container';
                playerBox.style.width = '100%';
                playerBox.style.height = '100%';
                previewBody.appendChild(playerBox);
                art = new Artplayer({
                    container: '#artplayer-container',
                    url,
                    autoplay: true,
                    theme: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ffffff',
                    autoSize: true,
                    hotkey: true,
                    setting: true,
                    fullscreen: true,
                    pip: true,
                });
                break;
            case 'text':
                const textBox = document.createElement('div');
                textBox.className = 'text-preview';
                textBox.textContent = '加载中...';
                previewBody.appendChild(textBox);
                fetch(url).then(r => r.text()).then(content => {
                    textBox.textContent = content;
                }).catch(() => {
                    textBox.textContent = '无法加载文本预览，请尝试直接打开文件。';
                });
                break;
            case 'pdf':
                const frame = document.createElement('iframe');
                frame.src = url;
                frame.style.width = '100%';
                frame.style.height = '100%';
                frame.style.border = 'none';
                frame.title = item.name;
                previewBody.appendChild(frame);
                break;
            default:
                window.location.href = url;
                return;
        }
        previewLayer.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function destroyArt() {
        if (art && typeof art.destroy === 'function') {
            art.destroy(false);
            art = null;
        }
    }

    function closePreview() {
        destroyArt();
        previewLayer.classList.remove('active');
        document.body.style.overflow = '';
    }

    function parentPath() {
        const path = currentPath.split('/').filter(Boolean);
        path.pop();
        const merged = path.length ? `/${path.join('/')}` : rootPath || '/';
        return merged || '/';
    }

    function initEvents() {
        document.querySelectorAll('.list-head button').forEach(btn => {
            btn.addEventListener('click', () => {
                const key = btn.getAttribute('data-sort');
                if (state.sortKey === key) {
                    state.direction = state.direction === 'asc' ? 'desc' : 'asc';
                } else {
                    state.sortKey = key;
                    state.direction = 'asc';
                }
                renderList();
            });
        });

        document.getElementById('search').addEventListener('input', (e) => {
            state.search = e.target.value;
            renderList();
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });

        document.getElementById('back-button').addEventListener('click', () => {
            window.location.href = parentPath();
        });

        previewLayer.addEventListener('click', (e) => {
            if (e.target === previewLayer) closePreview();
        });

        document.getElementById('close-preview').addEventListener('click', closePreview);
    }

    initTheme();
    breadcrumb();
    initEvents();
    renderList();
</script>
</body>
</html>
