<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge, Chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
    <title>OneList - 霜白卡片主题</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.css">
    <style>
        :root {
            --panel: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.12);
            --text: #f7f7f7;
            --muted: #c8c8c8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background: linear-gradient(145deg, #0f1115, #0c0c0f 40%, #0d0f12);
        }
        a { color: inherit; text-decoration: none; }
        header {
            position: sticky; top: 0; z-index: 5;
            backdrop-filter: blur(14px);
            background: rgba(12, 12, 15, 0.78);
            border-bottom: 1px solid var(--border);
            padding: 18px 28px 14px;
        }
        .headline { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
        .headline h1 { margin: 0; letter-spacing: 1px; font-weight: 700; font-size: 22px; display: flex; align-items: center; gap: 10px; }
        .pill { padding: 6px 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); font-size: 12px; color: var(--muted); }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .search { flex: 1 1 260px; position: relative; }
        .search input {
            width: 100%; padding: 12px 14px 12px 38px; border-radius: 10px;
            background: var(--panel); border: 1px solid var(--border); color: var(--text);
            outline: none; backdrop-filter: blur(14px);
        }
        .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); fill: var(--muted); }
        .sorter { display: flex; gap: 10px; }
        .sort-btn {
            padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--panel); color: var(--text); font-weight: 600; cursor: pointer;
        }
        .sort-btn.active { background: rgba(255,255,255,0.12); color: #111; }
        .sort-btn.active span { color: #111; }
        .crumbs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
        .crumbs a { color: var(--text); padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); }
        .container { padding: 20px 24px 32px; position: relative; z-index: 1; }
        .list {
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .list-head, .entry {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr 0.6fr 0.6fr;
            gap: 12px;
            padding: 14px 16px;
            align-items: center;
        }
        .list-head { background: rgba(255,255,255,0.05); font-weight: 700; color: var(--muted); }
        .entry { border-top: 1px solid var(--border); transition: background 0.15s ease; }
        .entry:hover { background: rgba(255,255,255,0.06); }
        .name { display: flex; align-items: center; gap: 10px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .name .icon { width: 20px; height: 20px; display: inline-block; }
        .label { color: var(--muted); font-size: 13px; }
        .actions { display: flex; gap: 8px; }
        .btn {
            padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--panel); color: var(--text); font-weight: 600; cursor: pointer;
        }
        .btn:hover { background: rgba(255,255,255,0.14); }
        .btn.secondary { padding: 8px 12px; }
        .overlay {
            position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px); z-index: 10; padding: 18px;
        }
        .overlay.show { display: flex; }
        .overlay-card {
            width: min(1200px, 94vw); height: min(720px, 84vh);
            background: rgba(18, 18, 22, 0.82); border: 1px solid var(--border); border-radius: 14px;
            box-shadow: 0 18px 48px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden;
        }
        .overlay-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); }
        .overlay-title { font-weight: 700; font-size: 15px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .overlay-body { flex: 1; display: grid; place-items: center; padding: 14px; }
        .overlay-body img { max-width: 100%; max-height: 100%; border-radius: 10px; border: 1px solid var(--border); }
        .overlay-body audio { width: min(520px, 92vw); }
        .empty { text-align: center; padding: 48px 16px; color: var(--muted); border: 1px dashed var(--border); border-radius: 12px; background: rgba(255,255,255,0.03); margin-top: 12px; }
        @media (max-width: 820px) {
            .list-head, .entry { grid-template-columns: 1.4fr 0.9fr 0.8fr; }
            .actions { grid-column: 1 / -1; }
        }
        @media (max-width: 560px) {
            header { padding: 14px 16px 10px; }
            .list-head, .entry { grid-template-columns: 1fr; }
            .label, .pill { font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="grain"></div>
<header>
    <div class="headline">
        <h1>
            <span aria-hidden="true">◆</span>
            <span style="cursor: pointer;" onclick="gotoPath(rootPath)">OneList</span>
            <span class="pill">Frosted Card</span>
        </h1>
        <div class="controls">
            <div class="sorter">
                <button class="sort-btn active" data-sort="name" onclick="toggleSort('name')">名称<span class="pill" id="sort-name">↑</span></button>
                <button class="sort-btn" data-sort="date" onclick="toggleSort('date')">时间<span class="pill" id="sort-date">↕</span></button>
                <button class="sort-btn" data-sort="size" onclick="toggleSort('size')">大小<span class="pill" id="sort-size">↕</span></button>
            </div>
        </div>
    </div>
    <div class="controls">
        <div class="search">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"></path></svg>
            <input id="searchInput" type="search" placeholder="搜索文件 / 文件夹" oninput="renderList()">
        </div>
        <div class="crumbs" id="crumbs"></div>
    </div>
</header>

<main class="container">
    <div class="list">
        <div class="list-head">
            <div>名称</div>
            <div class="label">时间</div>
            <div class="label">大小</div>
            <div class="label">操作</div>
        </div>
        <div id="listBody"></div>
    </div>
    <div id="empty" class="empty" style="display:none;">暂无内容</div>
</main>

<div id="previewOverlay" class="overlay" role="dialog" aria-modal="true">
    <div class="overlay-card">
        <div class="overlay-head">
            <div id="overlayTitle" class="overlay-title"></div>
            <button class="btn secondary" onclick="closePreview()">关闭</button>
        </div>
        <div id="overlayBody" class="overlay-body"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
<script>
    const rootPath = "{{.RootPath}}";
    let currentPath = "{{.CurrentPath}}";
    const rawData = "{{.RawData}}";
    const host = window.location.host;
    if (currentPath === "/") { currentPath = ""; }

    const pageData = JSON.parse(window.atob(rawData));
    const folders = [];
    const files = [];
    for (const key in pageData) {
        if (key.indexOf("@") === 0) continue;
        if (pageData[key]['@type'] === 'folder') {
            folders.push(pageData[key]);
        } else if (pageData[key]['@type'] === 'file') {
            files.push(pageData[key]);
        }
    }

    const state = { sort: 'name', reverse: false };
    let art = null;

    function gotoPath(path) {
        window.location.href = path;
    }

    function safeDecode(text) {
        try {
            return decodeURIComponent(text);
        } catch (e) {
            return text || '';
        }
    }

    function sizeToNumber(size) {
        if (!size) return 0;
        const [num, unit] = size.split(" ");
        const value = parseFloat(num);
        const map = { B: 0, KB: 1, MB: 2, GB: 3, TB: 4, PB: 5 };
        return value * Math.pow(1024, map[unit] || 0);
    }

    function compare(field) {
        return function(a, b) {
            let v1 = a[field] || "";
            let v2 = b[field] || "";
            if (field === "size") {
                v1 = sizeToNumber(v1.toUpperCase());
                v2 = sizeToNumber(v2.toUpperCase());
            } else {
                v1 = v1.toString().toLowerCase();
                v2 = v2.toString().toLowerCase();
            }
            return v1 > v2 ? 1 : v1 < v2 ? -1 : 0;
        }
    }

    function toggleSort(field) {
        if (state.sort === field) {
            state.reverse = !state.reverse;
        } else {
            state.sort = field;
            state.reverse = false;
        }
        document.querySelectorAll('.sort-btn').forEach(btn => {
            const active = btn.dataset.sort === state.sort;
            btn.classList.toggle('active', active);
            const hint = document.getElementById('sort-' + btn.dataset.sort);
            hint.textContent = active ? (state.reverse ? '↓' : '↑') : '↕';
        });
        renderList();
    }

    function getType(name) {
        const lower = name.toLowerCase();
        const img = ['.png','.jpg','.jpeg','.bmp','.webp','.gif'];
        const vid = ['.mp4','.mkv','.avi','.mov','.flv','.wmv','.m3u8','.ts'];
        const aud = ['.mp3','.flac','.aac','.wav','.ogg','.m4a'];
        if (img.some(ext => lower.endsWith(ext))) return 'image';
        if (vid.some(ext => lower.endsWith(ext))) return 'video';
        if (aud.some(ext => lower.endsWith(ext))) return 'audio';
        return 'other';
    }

    function getIcon(type) {
        switch (type) {
            case 'folder':
                return '<svg viewBox="0 0 24 24"><path d="M10 4l2 2h8a1 1 0 0 1 1 1v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2L3 5a1 1 0 0 1 1-1h6z"/></svg>';
            case 'image':
                return '<svg viewBox="0 0 24 24"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14h18zM5 5h14v9l-3.5-3.5-4.5 5L8 12 5 15V5z"/></svg>';
            case 'audio':
                return '<svg viewBox="0 0 24 24"><path d="M9 17a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 4a1 1 0 1 1 .002-2.002A1 1 0 0 1 9 21zm9-4V5l-8 2v11.35A3.99 3.99 0 0 0 8 14a4 4 0 1 0 2 3.465V10.91l6-1.5V17h2z"/></svg>';
            case 'video':
                return '<svg viewBox="0 0 24 24"><path d="M4 4h12a2 2 0 0 1 2 2v3l4-2v10l-4-2v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>';
            default:
                return '<svg viewBox="0 0 24 24"><path d="M6 2h7l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm6 7h5l-5-5v5z"/></svg>';
        }
    }

    function buildBreadcrumb() {
        const crumbs = document.getElementById('crumbs');
        crumbs.innerHTML = '';
        const clean = currentPath.replace(/^\//, '').replace(/\/$/, '');
        const parts = clean ? clean.split('/') : [];
        const nodes = [];
        const home = document.createElement('a');
        home.textContent = '根目录';
        home.href = '//' + host + rootPath;
        nodes.push(home);
        let pathStack = rootPath === '/' ? '' : rootPath;
        parts.forEach((part, idx) => {
            pathStack += '/' + part;
            const link = document.createElement('a');
            link.textContent = safeDecode(part);
            link.href = '//' + host + pathStack;
            nodes.push(link);
        });
        nodes.forEach(node => crumbs.appendChild(node));
    }

    function buildUrl(name) {
        const encoded = encodeURIComponent(name);
        const baseRaw = currentPath || rootPath || '';
        const base = baseRaw.endsWith('/') ? baseRaw.slice(0, -1) : baseRaw;
        return '//' + host + base + '/' + encoded;
    }

    function renderList() {
        const grid = document.getElementById('listBody');
        const empty = document.getElementById('empty');
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        const filter = item => safeDecode(item.name).toLowerCase().includes(keyword);

        let f = folders.filter(filter);
        let fl = files.filter(filter);
        f.sort(compare(state.sort));
        fl.sort(compare(state.sort));
        if (state.reverse) { f.reverse(); fl.reverse(); }
        const items = f.concat(fl);

        grid.innerHTML = '';
        if (items.length === 0) {
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        items.forEach(item => {
            const isFolder = item['@type'] === 'folder';
            const name = safeDecode(item.name);
            const type = isFolder ? 'folder' : getType(name);
            const url = buildUrl(name);
            const row = document.createElement('div');
            row.className = 'entry';

            const nameCell = document.createElement('div');
            nameCell.className = 'name';
            const iconWrap = document.createElement('span');
            iconWrap.className = 'icon';
            iconWrap.innerHTML = getIcon(type);
            const text = document.createElement('span');
            text.textContent = name;
            nameCell.appendChild(iconWrap);
            nameCell.appendChild(text);
            nameCell.onclick = () => gotoPath(url);

            const timeCell = document.createElement('div');
            timeCell.className = 'label';
            timeCell.textContent = item.date || '--';

            const sizeCell = document.createElement('div');
            sizeCell.className = 'label';
            sizeCell.textContent = item.size || '0 B';

            const actionCell = document.createElement('div');
            actionCell.className = 'actions';
            const openBtn = document.createElement('button');
            openBtn.className = 'btn';
            openBtn.textContent = isFolder ? '打开' : '下载/打开';
            openBtn.onclick = (e) => { e.stopPropagation(); gotoPath(url); };
            actionCell.appendChild(openBtn);

            if (!isFolder && type !== 'other') {
                const previewBtn = document.createElement('button');
                previewBtn.className = 'btn secondary';
                previewBtn.textContent = '预览';
                previewBtn.onclick = (event) => {
                    event.stopPropagation();
                    openPreview(type, url, name);
                };
                actionCell.appendChild(previewBtn);
            }

            row.appendChild(nameCell);
            row.appendChild(timeCell);
            row.appendChild(sizeCell);
            row.appendChild(actionCell);
            row.onclick = () => {
                if (isFolder) {
                    gotoPath(url);
                } else if (type !== 'other') {
                    openPreview(type, url, name);
                } else {
                    gotoPath(url);
                }
            };
            grid.appendChild(row);
        });
    }

    function openPreview(type, url, name) {
        const overlay = document.getElementById('previewOverlay');
        const body = document.getElementById('overlayBody');
        const title = document.getElementById('overlayTitle');
        title.textContent = name;
        body.innerHTML = '';
        if (art) { art.destroy(false); art = null; }

        if (type === 'image') {
            const img = document.createElement('img');
            img.src = url;
            img.alt = name;
            body.appendChild(img);
        } else if (type === 'audio') {
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.autoplay = true;
            audio.src = url;
            body.appendChild(audio);
        } else if (type === 'video') {
            const playerBox = document.createElement('div');
            playerBox.style.width = '100%';
            playerBox.style.height = '100%';
            body.appendChild(playerBox);
            art = new Artplayer({
                container: playerBox,
                url: url,
                autoplay: true,
                theme: '#ffffff',
                loop: false,
                autoOrientation: true,
                controls: [
                    { name: 'play' },
                    { name: 'progress' },
                    { name: 'time' },
                    { name: 'volume' },
                    { name: 'setting' },
                    { name: 'pip' },
                    { name: 'fullscreen' }
                ],
            });
        } else {
            const link = document.createElement('a');
            link.href = url;
            link.target = '_blank';
            link.rel = 'noreferrer noopener';
            link.textContent = '打开文件';
            link.className = 'btn';
            body.appendChild(link);
        }
        overlay.classList.add('show');
    }

    function closePreview() {
        const overlay = document.getElementById('previewOverlay');
        overlay.classList.remove('show');
        document.getElementById('overlayBody').innerHTML = '';
        if (art) {
            art.destroy(false);
            art = null;
        }
    }

    document.getElementById('previewOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'previewOverlay') {
            closePreview();
        }
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closePreview();
        }
    });

    buildBreadcrumb();
    renderList();
</script>
</body>
</html>
